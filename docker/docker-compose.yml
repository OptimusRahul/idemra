services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: idemra
      POSTGRES_USER: idemra
      POSTGRES_PASSWORD: idemra
    ports:
      - "5432:5432"
    volumes:
      - idemra_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - idemra_redis:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - idemra_qdrant:/qdrant/storage

volumes:
  idemra_postgres:
  idemra_redis:
  idemra_qdrant:
