[project]
name = "idemra"
version = "0.1.0"
description = "Production reliability infrastructure for coding agents — idempotent event log, crash recovery, replay-as-audit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Rahul Srivastava" }]

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "rq>=2.1",
    "qdrant-client>=1.12",
    "litellm>=1.55",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "pyyaml>=6.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
idemra = "idemra.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idemra"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
